  Used Gemini for codebase planning and architecture design. Used Claude for coding modules,
  refactoring, and formatting explainability and Trust & Risk logic. No candidate data was
  shared with any hosted LLM.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  TALOS AI implements a modular, multi-stage retrieval and ranking pipeline.
  1. Fast Retrieval (Sparse search): Uses a TF-IDF index and profile filters (production
     ML keywords, stability analytics, notice period, and relocation fits) to retrieve
     the top 8,000 candidates and completely override/eliminate 2,381 honeypots and
     consulting-only candidates. This takes only 10 seconds.
  2. Dense Match: Generates dense embeddings (all-MiniLM-L6-v2) for the 8,000 candidates to
     compute semantic similarities, compressing disk storage to 15 MB and online ranking
     to under 5 seconds.
  3. ML Ranker: Trains a LightGBM regressor on engineered candidate features against hybrid
     scoring targets to output a smooth, robust model.
  4. Explainability: Generates factual recruiter summaries (0% hallucination rate).

